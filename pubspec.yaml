name: radiux
description: App de medicina nuclear — conversión y decaimiento radiactivo
publish_to: 'none'
version: 2.0.4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  intl: ^0.20.3
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  audioplayers: ^6.0.0
  wakelock_plus: ^1.3.1
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.3

flutter_native_splash:
  color: "#07070F"
  android_12:
    icon_background_color: "#07070F"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#07070F"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
    - assets/sounds/
